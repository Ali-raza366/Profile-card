<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src="image.jpg" alt="image" class="profile-card">
        </div>
        <div class="text-data">
            <span class="name">Ali Raza</span>
            <span class="job">Web developer</span>
        </div>
        <div class="media-buttons">
            <a href="https://www.facebook.com/profile.php?id=100077061520011" style="background-color: #4267b2;" class="link">
                <i class='bx bxl-facebook'></i>
            </a>
            <a href="https://www.tiktok.com/@its_razach789"  style="background-color: #000000;"  class="link">
                <i class='bx bxl-tiktok'></i> 
            </a>
            <a href="https://www.instagram.com/alirazach_789/" style="background-color: #e1306c;" class="link">
                <i class='bx bxl-instagram'></i>
            </a>
            <a href="https://www.youtube.com/@itsali-raza789" style="background-color: #ff0000 " class="link">
                <i class='bx bxl-youtube'></i>
               
            </a>
        </div>
        <div class="buttons">
            <button class="button">Subscribe</button>
            <button class="button">Message</button>
        </div>
        <div class="analytics">
            <div class="data">
            
                <i class='bx bx-heart'></i>
                <span class="number">10k</span>
            </div>
            <div class="data">
            
                <i class='bx bx-message-rounded'></i>
                <span class="number">2k</span>
            </div>
            <div class="data">
                <i class='bx bx-share'></i>
                <span class="number">1k</span>
            </div>
        </div>
    </div>
</body>
</html>
